/* ============================================================
   POKÉDEX DO J — 1025 Pokémon, 9 gerações
   Arquivo único. Basta abrir.
   ============================================================ */

:root{
  --bg:#0B0E14; --surface:#141926; --surface-2:#1A2131;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --text:#E7ECF5; --muted:#79839A; --ghost:#2F3746;

  --t-normal:#A8A77A; --t-fire:#EE8130;  --t-water:#6390F0; --t-electric:#F7D02C;
  --t-grass:#7AC74C;  --t-ice:#96D9D6;   --t-fighting:#D6453F; --t-poison:#B558B0;
  --t-ground:#E2BF65; --t-flying:#A98FF3; --t-psychic:#F95587; --t-bug:#B4C424;
  --t-rock:#C4AE45;   --t-ghost:#8770B8; --t-dragon:#7B4CFF; --t-dark:#9A7B62;
  --t-steel:#B7B7CE;  --t-fairy:#E58CB5;

  --r:14px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:radial-gradient(120% 70% at 50% -10%, #16203A 0%, transparent 55%), var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font-family:"Space Grotesk",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

/* ---------- CABEÇALHO ---------- */

.top{
  position:sticky;top:0;z-index:20;
  background:rgba(11,14,20,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:14px 16px 12px;
}
.inner{max-width:1360px;margin:0 auto}

.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:clamp(19px,4.4vw,26px);font-weight:700;letter-spacing:-.02em}

.perfil{position:relative;display:flex;align-items:center;gap:9px}

.avatar{
  width:38px;height:38px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--line-2);
  color:var(--text);font:600 15px/1 "Space Grotesk",sans-serif;
  cursor:pointer;transition:.18s;
}
.avatar:hover{border-color:var(--text)}
.avatar[aria-expanded="true"]{background:var(--text);color:#0B0E14;border-color:var(--text)}

.menu{
  position:absolute;top:calc(100% + 10px);right:0;z-index:40;width:246px;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:16px;
  padding:6px;box-shadow:0 20px 50px -20px rgba(0,0,0,.8);
  animation:entra .18s cubic-bezier(.2,.8,.2,1);
}
.menu[hidden]{display:none}

.menu-topo{padding:12px 12px 11px;border-bottom:1px solid var(--line);margin-bottom:6px;display:grid;gap:3px}
.menu-nome{font-size:14px;font-weight:600;letter-spacing:-.01em}
.menu-sub{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}

.item{
  display:block;width:100%;text-align:left;
  font:500 13px/1 "Space Grotesk",sans-serif;color:var(--text);
  background:none;border:0;border-radius:9px;padding:11px 12px;cursor:pointer;
}
.item:hover{background:rgba(255,255,255,.06)}

.menu-pe{
  margin-top:6px;padding:11px 12px 8px;border-top:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);line-height:1.5;
}
.dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:#4ADE80;margin-right:6px;vertical-align:middle}
.dot.warn{background:#F7D02C}

.count{display:flex;align-items:flex-end;gap:8px;margin-bottom:10px;font-family:"IBM Plex Mono",monospace}
.count b{font-size:clamp(28px,7vw,38px);font-weight:600;line-height:.9;letter-spacing:-.03em}
.count span{font-size:14px;color:var(--muted);padding-bottom:3px}

.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);overflow:hidden}
.bar-fill{height:100%;width:0%;background:transparent;transition:width .45s cubic-bezier(.2,.8,.2,1)}

.hint{margin-top:8px;display:flex;gap:16px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.hint i{font-style:normal;color:var(--text)}

.controls{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.search{
  flex:1 1 200px;min-width:0;font:500 14px/1 "Space Grotesk",sans-serif;color:var(--text);
  background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:11px 16px;
}
.search::placeholder{color:var(--muted)}
.filters{display:flex;gap:6px}
.chip{
  font:500 13px/1 "Space Grotesk",sans-serif;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:10px 15px;cursor:pointer;transition:.18s;
}
.chip:hover{color:var(--text);border-color:var(--line-2)}
.chip[aria-selected="true"]{background:var(--text);color:#0B0E14;border-color:var(--text)}
.select{
  font:500 13px/1 "Space Grotesk",sans-serif;color:var(--text);
  background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:10px 14px;cursor:pointer;appearance:none;-webkit-appearance:none;
}
.select option{background:#141926}
.search:focus,.select:focus{outline:none;border-color:var(--line-2)}
.search:focus-visible,.chip:focus-visible,.select:focus-visible,
.ghost:focus-visible,.card:focus-visible{outline:2px solid #6EA8FF;outline-offset:2px}

/* ---------- GRADE ---------- */

.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 64px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(clamp(92px,12.5vw,150px),1fr));
  gap:10px;
}

.card{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 8px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);
  cursor:pointer;font-family:inherit;color:inherit;text-align:center;opacity:.74;
  content-visibility:auto;contain-intrinsic-size:auto 176px;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),opacity .25s,border-color .25s,background .25s,box-shadow .25s;
}
.card:hover{transform:translateY(-3px);opacity:.92;border-color:var(--line-2)}
.card[hidden]{display:none}

.num{align-self:flex-start;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);letter-spacing:.04em}

/* A ARTE: duas camadas sobrepostas, uma para cada modo.
   .foto  = imagem real (escurecida por filtro quando falta)
   .silh  = máscara recolorida pelo CSS (modo cor do tipo)   */
.art{position:relative;display:block;width:100%;aspect-ratio:1/1}
.foto,.silh{
  position:absolute;inset:0;width:100%;height:100%;
  transition:filter .35s ease,background-color .35s ease;
}
.foto{object-fit:contain}
.silh{
  background-color:var(--ghost);
  -webkit-mask-image:var(--sprite);   mask-image:var(--sprite);
  -webkit-mask-size:contain;          mask-size:contain;
  -webkit-mask-repeat:no-repeat;      mask-repeat:no-repeat;
  -webkit-mask-position:center;       mask-position:center;
}

/* modo FOTO: some a máscara, a imagem vira sombra quando falta */
body.modo-foto .silh{display:none}
body.modo-foto .foto{filter:brightness(0) invert(.19)}
body.modo-foto .card.own .foto,
body.modo-foto .palco.acerto .foto{
  filter:drop-shadow(0 3px 16px color-mix(in srgb,var(--c) 50%,transparent));
}

/* modo COR DO TIPO: some a foto, vale a máscara */
body.modo-cor .foto{display:none}

.name{
  font-size:clamp(10.5px,1.6vw,13px);font-weight:500;letter-spacing:-.01em;
  line-height:1.2;margin-top:2px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.tags{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:5px}
.tag{
  font-family:"IBM Plex Mono",monospace;font-style:normal;font-size:8.5px;
  letter-spacing:.06em;text-transform:uppercase;padding:2.5px 5px;border-radius:5px;
  color:var(--t);
  background:color-mix(in srgb,var(--t) 15%,transparent);
  border:1px solid color-mix(in srgb,var(--t) 28%,transparent);
}

/* ---------- ESTADO: JÁ TENHO ---------- */

.card.own{
  opacity:1;
  background:radial-gradient(115% 78% at 50% 0%,color-mix(in srgb,var(--c) 17%,transparent),transparent 68%),var(--surface-2);
  border-color:color-mix(in srgb,var(--c) 42%,transparent);
  box-shadow:0 10px 30px -18px color-mix(in srgb,var(--c) 90%,transparent);
}
.card.own .silh{
  background-color:color-mix(in srgb,var(--c) 90%,#fff);
  filter:drop-shadow(0 3px 14px color-mix(in srgb,var(--c) 55%,transparent));
}
.card.own .num{color:color-mix(in srgb,var(--c) 70%,#fff)}
.card.own .name{font-weight:600}
.card.own::before{
  content:"";position:absolute;top:9px;right:9px;width:7px;height:7px;
  border-radius:99px;background:var(--c);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent);
}
.card.pulse::after{
  content:"";position:absolute;inset:0;border-radius:var(--r);
  border:1.5px solid var(--c);pointer-events:none;
  animation:pulse .55s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.13);opacity:0}}

/* ---------- CARREGANDO / VAZIO / RODAPÉ ---------- */

.tela{padding:80px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}
.tela b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.tela .prog{font-family:"IBM Plex Mono",monospace;font-size:12px;margin-top:14px}
.tela button{
  margin-top:16px;font:500 13px/1 "Space Grotesk",sans-serif;color:var(--text);
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:99px;
  padding:11px 20px;cursor:pointer;
}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:99px;
  padding:11px 20px;font-size:13px;font-weight:500;z-index:50;
  box-shadow:0 12px 40px -12px rgba(0,0,0,.7);
  animation:sobe .25s cubic-bezier(.2,.8,.2,1);
}
@keyframes sobe{from{opacity:0;transform:translate(-50%,10px)}}

/* ---------- SORTEIO ---------- */

.primario{
  font:600 12px/1 "Space Grotesk",sans-serif;color:#0B0E14;
  background:var(--text);border:1px solid var(--text);border-radius:99px;
  padding:8px 15px;cursor:pointer;transition:.18s;
}
.primario:hover{opacity:.86}

.modal{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(6,8,12,.84);backdrop-filter:blur(6px);
  animation:fade .2s ease;
}
.modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}

.box{
  position:relative;width:100%;max-width:380px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:22px;
  padding:26px 22px 20px;text-align:center;
  animation:entra .3s cubic-bezier(.2,.8,.2,1);
}
@keyframes entra{from{opacity:0;transform:translateY(14px) scale(.97)}}

.fechar{
  position:absolute;top:10px;right:14px;background:none;border:0;
  color:var(--muted);font-size:24px;line-height:1;cursor:pointer;
}
.fechar:hover{color:var(--text)}

.palco{position:relative;width:min(200px,55vw);aspect-ratio:1/1;margin:4px auto 10px}
.palco .art{width:100%;height:100%}
.palco.acerto .silh{
  background-color:color-mix(in srgb,var(--c) 92%,#fff);
  filter:drop-shadow(0 6px 28px color-mix(in srgb,var(--c) 60%,transparent));
}
.palco.acerto::after{
  content:"";position:absolute;inset:-12px;border-radius:50%;
  border:2px solid var(--c);animation:pulse .7s cubic-bezier(.2,.8,.2,1) forwards;
}

.s-num{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);letter-spacing:.1em}
.s-nome{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:3px;min-height:29px}
.box .tags{margin-top:9px;min-height:16px}

.ghost{
  font:500 12px/1 "Space Grotesk",sans-serif;color:var(--muted);
  background:transparent;border:1px solid var(--line-2);border-radius:99px;
  padding:8px 13px;cursor:pointer;transition:.18s;
}
.ghost:hover{color:var(--text);border-color:var(--text)}

.acoes{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.acoes .primario,.acoes .ghost{padding:11px 18px;font-size:13px}

.lojas{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:9px}
.lojas a{
  font:500 12px/1 "Space Grotesk",sans-serif;color:var(--muted);
  text-decoration:none;border:1px solid var(--line);border-radius:99px;
  padding:9px 15px;transition:.18s;
}
.lojas a:hover{color:var(--text);border-color:var(--line-2)}
.lojas a::after{content:" ↗";opacity:.5}

.hist{
  margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
  text-align:left;font-family:"IBM Plex Mono",monospace;font-size:11px;
  color:var(--muted);display:grid;gap:6px;max-height:104px;overflow:auto;
}
.hist b{color:var(--text);font-weight:500}
.hist span{float:right}

@media (max-width:640px){
  .search{flex:1 1 100%;order:-1}
  .select{flex:1 1 calc(50% - 4px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<header class="top">
  <div class="inner">
    <div class="brand">
      <h1>Pokédex do J</h1>
      <div class="perfil">
        <button class="primario" id="sortear">Sortear</button>
        <button class="avatar" id="avatar" aria-haspopup="true" aria-expanded="false" aria-label="Perfil">J</button>

        <div class="menu" id="menu" hidden>
          <div class="menu-topo">
            <span class="menu-nome">Treinador J</span>
            <span class="menu-sub" id="menu-sub">0 Pokémon na coleção</span>
          </div>

          <button class="item" id="modo">Modo: foto</button>
          <button class="item" id="exportar">Exportar backup</button>
          <button class="item" id="importar">Importar backup</button>
          <input type="file" id="arquivo" accept="application/json" hidden>

          <div class="menu-pe" id="status">Carregando…</div>
        </div>
      </div>
    </div>

    <div class="count"><b id="c-own">0</b><span>/ <span id="c-total">1025</span> Pokémon</span></div>
    <div class="bar"><div class="bar-fill" id="bar"></div></div>
    <div class="hint">
      <span>Tenho <i id="s-own">0</i></span>

    <div class="controls">

      <div class="filters" role="tablist">

        <button class="chip" role="tab" data-filter="own" aria-selected="false">Tenho</button>
        <button class="chip" role="tab" data-filter="missing" aria-selected="false">Faltam</button>
      </div>
      <select id="geracao" class="select" aria-label="Geração">
        <option value="">Todas as gerações</option>
        <option value="1">Geração 1</option><option value="2">Geração 2</option>
        <option value="3">Geração 3</option><option value="4">Geração 4</option>
        <option value="5">Geração 5</option><option value="6">Geração 6</option>
        <option value="7">Geração 7</option><option value="8">Geração 8</option>
        <option value="9">Geração 9</option>
      </select>
      <select id="tipo" class="select" aria-label="Tipo"><option value="">Todos os tipos</option></select>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="tela" id="tela">
    <b>Preparando sua Pokédex</b>
    Buscando os 1025 Pokémon. Isso acontece só desta vez.
    <div class="prog" id="prog">0 / 19</div>
  </div>

  <main class="grid" id="grid" hidden></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-label="Sorteio">
    <button class="fechar" id="fechar" aria-label="Fechar">×</button>

    <div class="palco" id="palco">
      <span class="art">
        <img class="foto" id="s-foto" alt="">
        <span class="silh" id="s-silh"></span>
      </span>
    </div>
    <div class="s-num"  id="s-num">#????</div>
    <div class="s-nome" id="s-nome">Sorteando…</div>
    <div class="tags"   id="s-tags"></div>

    <div class="acoes" id="acoes" hidden>
      <button class="primario" id="marcar">Já tenho este</button>
      <button class="ghost" id="denovo">Sortear outro</button>
    </div>

    <div class="lojas" id="lojas"></div>

    <div class="hist" id="hist"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
/* ============================================================
   CONFIGURAÇÃO
   ============================================================ */

const API    = "https://pokeapi.co/api/v2";
const SPRITE = id => `https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/official-artwork/${id}.png`;
const TOTAL  = 1025;

const CORES = {
  normal:"#A8A77A", fire:"#EE8130", water:"#6390F0", electric:"#F7D02C",
  grass:"#7AC74C",  ice:"#96D9D6",  fighting:"#D6453F", poison:"#B558B0",
  ground:"#E2BF65", flying:"#A98FF3", psychic:"#F95587", bug:"#B4C424",
  rock:"#C4AE45",   ghost:"#8770B8", dragon:"#7B4CFF", dark:"#9A7B62",
  steel:"#B7B7CE",  fairy:"#E58CB5"
};

/* último número de cada geração */
const FAIXAS = [151,251,386,493,649,721,809,905,1025];
const geracao = id => FAIXAS.findIndex(f => id <= f) + 1;

const pad = id => "#" + String(id).padStart(4,"0");
const $   = s => document.querySelector(s);

/* nomes que a API entrega com hífen ou sufixo de forma */
const ESPECIAIS = {
  "nidoran-f":"Nidoran ♀","nidoran-m":"Nidoran ♂","mr-mime":"Mr. Mime","mr-rime":"Mr. Rime",
  "mime-jr":"Mime Jr.","farfetchd":"Farfetch'd","sirfetchd":"Sirfetch'd","ho-oh":"Ho-Oh",
  "porygon-z":"Porygon-Z","type-null":"Type: Null","jangmo-o":"Jangmo-o","hakamo-o":"Hakamo-o",
  "kommo-o":"Kommo-o","flabebe":"Flabébé","deoxys-normal":"Deoxys","wormadam-plant":"Wormadam",
  "giratina-altered":"Giratina","shaymin-land":"Shaymin","basculin-red-striped":"Basculin",
  "darmanitan-standard":"Darmanitan","tornadus-incarnate":"Tornadus","thundurus-incarnate":"Thundurus",
  "landorus-incarnate":"Landorus","keldeo-ordinary":"Keldeo","meloetta-aria":"Meloetta",
  "meowstic-male":"Meowstic","aegislash-shield":"Aegislash","pumpkaboo-average":"Pumpkaboo",
  "gourgeist-average":"Gourgeist","zygarde-50":"Zygarde","oricorio-baile":"Oricorio",
  "lycanroc-midday":"Lycanroc","wishiwashi-solo":"Wishiwashi","minior-red-meteor":"Minior",
  "mimikyu-disguised":"Mimikyu","toxtricity-amped":"Toxtricity","eiscue-ice":"Eiscue",
  "indeedee-male":"Indeedee","morpeko-full-belly":"Morpeko","urshifu-single-strike":"Urshifu",
  "basculegion-male":"Basculegion","enamorus-incarnate":"Enamorus","oinkologne-male":"Oinkologne",
  "maushold-family-of-four":"Maushold","squawkabilly-green-plumage":"Squawkabilly",
  "palafin-zero":"Palafin","tatsugiri-curly":"Tatsugiri","dudunsparce-two-segment":"Dudunsparce",
  "ogerpon-teal-mask":"Ogerpon","terapagos-normal":"Terapagos"
};
const nomeBonito = b =>
  ESPECIAIS[b] ?? b.split("-").map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(" ");

/* ============================================================
   SALVAMENTO — só esta parte toca no armazenamento
   ============================================================ */

const Salvo = {
  COLECAO:"pokedex.colecao.v1",
  DADOS:"pokedex.dados.v1",
  SORTEIOS:"pokedex.sorteios.v1",
  onde:"navegador",
  _t:null,

  async ler(chave){
    if (window.storage){
      this.onde = "nuvem do preview";
      try{ return (await window.storage.get(chave)).value; }catch(e){ return null; }
    }
    try{ return localStorage.getItem(chave); }
    catch(e){ this.onde = "somente esta aba"; return null; }
  },

  async gravar(chave, texto){
    if (window.storage) await window.storage.set(chave, texto);
    else localStorage.setItem(chave, texto);
  },

  /* espera 250ms para não gravar a cada clique solto */
  colecao(set){
    clearTimeout(this._t);
    this._t = setTimeout(async ()=>{
      try{
        await this.gravar(this.COLECAO, JSON.stringify([...set].sort((a,b)=>a-b)));
        status(true);
      }catch(e){ status(false); }
    }, 250);
  }
};

/* ============================================================
   BUSCA DOS DADOS — 19 requisições, uma única vez na vida
   ------------------------------------------------------------
   1 chamada traz os 1025 nomes.
   18 chamadas (uma por tipo) trazem quem é de cada tipo,
   com slot 1 = tipo principal e slot 2 = secundário.
   ============================================================ */

async function baixarDados(){
  let feitas = 0;
  const passo = () => $("#prog").textContent = `${++feitas} / 19`;

  const idDaURL = url => Number(url.match(/\/(\d+)\/?$/)[1]);

  const pedir = async url => {
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    passo();
    return j;
  };

  const [lista, ...tipos] = await Promise.all([
    pedir(`${API}/pokemon?limit=${TOTAL}`),
    ...Array.from({length:18}, (_,i) => pedir(`${API}/type/${i+1}`))
  ]);

  /* nomes: a lista vem em ordem de Pokédex, então índice + 1 = número */
  const mapa = new Map();
  lista.results.forEach((p,i) => mapa.set(i+1, { nome:nomeBonito(p.name), tipos:[] }));

  /* tipos: descarta formas alternativas (id acima de 10000) */
  tipos.forEach(t => {
    t.pokemon.forEach(({pokemon, slot}) => {
      const id = idDaURL(pokemon.url);
      const alvo = mapa.get(id);
      if (alvo) alvo.tipos[slot-1] = t.name;
    });
  });

  const dados = [...mapa].map(([id,{nome,tipos}]) => [
    id, nome, tipos.filter(Boolean).length ? tipos.filter(Boolean) : ["normal"]
  ]);

  await Salvo.gravar(Salvo.DADOS, JSON.stringify(dados));
  return dados;
}

/* ============================================================
   ESTADO E RENDER
   ============================================================ */

let POKEMON = [];
let tenho   = new Set();
let filtro  = { estado:"all", geracao:"", tipo:"", busca:"" };

const grid = $("#grid");

function status(ok){
  $("#status").innerHTML = ok
    ? `<span class="dot"></span>Salvo automaticamente · ${Salvo.onde}`
    : `<span class="dot warn"></span>Não consegui salvar. Exporte um backup.`;
}

function aviso(msg){
  const t = $("#toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(aviso._t);
  aviso._t = setTimeout(()=> t.hidden = true, 3200);
}

/* a silhueta só é baixada quando o card chega perto da tela */
const observador = new IntersectionObserver((itens, obs)=>{
  itens.forEach(e=>{
    if(!e.isIntersecting) return;
    const url = SPRITE(e.target.dataset.id);
    e.target.querySelector(".silh").style.setProperty("--sprite", `url('${url}')`);
    e.target.querySelector(".foto").src = url;      // mesma URL: o navegador baixa uma vez só
    obs.unobserve(e.target);
  });
}, { rootMargin:"500px 0px" });

function montar(){
  const frag = document.createDocumentFragment();

  POKEMON.forEach(([id, nome, tipos])=>{
    const c = document.createElement("button");
    c.className = "card";
    c.dataset.id    = id;
    c.dataset.gen   = geracao(id);
    c.dataset.tipos = tipos.join(" ");
    c.dataset.busca = (nome + " " + pad(id) + " " + id).toLowerCase();
    c.style.setProperty("--c", CORES[tipos[0]]);
    c.setAttribute("aria-pressed","false");
    c.setAttribute("aria-label", `${nome}, ${pad(id)}`);
    c.innerHTML =
      `<span class="num">${pad(id)}</span>` +
      `<span class="art"><img class="foto" alt=""><span class="silh"></span></span>` +
      `<span class="name">${nome}</span>` +
      `<span class="tags">${tipos.map(t=>`<i class="tag" style="--t:${CORES[t]}">${t}</i>`).join("")}</span>`;
    frag.appendChild(c);
    observador.observe(c);
  });

  grid.appendChild(frag);
  grid.hidden = false;
  $("#tela").hidden = true;
}

function filtrar(){
  const termo = filtro.busca.trim().toLowerCase();
  let visiveis = 0;

  grid.querySelectorAll(".card").forEach(c=>{
    const possuo = tenho.has(+c.dataset.id);
    const ok =
      (filtro.estado === "all" || (filtro.estado === "own") === possuo) &&
      (!filtro.geracao || c.dataset.gen === filtro.geracao) &&
      (!filtro.tipo    || c.dataset.tipos.split(" ").includes(filtro.tipo)) &&
      (!termo          || c.dataset.busca.includes(termo));
    c.hidden = !ok;
    if (ok) visiveis++;
  });

  const tela = $("#tela");
  if (visiveis === 0){
    tela.hidden = false;
    tela.innerHTML = `<b>Nada por aqui</b>${
      termo ? `Nenhum Pokémon encontrado para “${filtro.busca}”.`
            : filtro.estado === "own" ? "Você ainda não marcou nenhum Pokémon deste recorte."
                                      : "Você já tem todos os Pokémon deste recorte."}`;
  } else {
    tela.hidden = true;
  }
}

function contar(){
  const n = tenho.size, pct = Math.round(n / POKEMON.length * 100);
  $("#c-own").textContent     = n;
  $("#c-total").textContent   = POKEMON.length;
  $("#s-own").textContent     = n;
  $("#s-missing").textContent = POKEMON.length - n;
  $("#s-pct").textContent     = pct + "%";
  $("#menu-sub").textContent  = `${n} Pokémon na coleção`;

  /* a barra é a faixa de cores dos tipos que você já capturou */
  const bar = $("#bar");
  bar.style.width = pct + "%";

  let cores = POKEMON.filter(p => tenho.has(p[0])).map(p => CORES[p[2][0]]);
  if (cores.length > 60){
    const salto = cores.length / 60;
    cores = Array.from({length:60}, (_,i) => cores[Math.floor(i*salto)]);
  }
  bar.style.background = cores.length
    ? `linear-gradient(90deg,${cores.map((c,i)=>`${c} ${i/cores.length*100}%,${c} ${(i+1)/cores.length*100}%`).join(",")})`
    : "transparent";
}

/* ============================================================
   INTERAÇÃO
   ============================================================ */

grid.addEventListener("click", e=>{
  const card = e.target.closest(".card");
  if (!card) return;

  const id = +card.dataset.id;
  const possuo = !tenho.has(id);

  if (possuo){
    tenho.add(id);
    card.classList.remove("pulse");
    void card.offsetWidth;
    card.classList.add("pulse");
  } else tenho.delete(id);

  card.classList.toggle("own", possuo);
  card.setAttribute("aria-pressed", possuo);

  Salvo.colecao(tenho);
  contar();
  if (filtro.estado !== "all") filtrar();
});

document.querySelectorAll(".chip").forEach(chip=>{
  chip.addEventListener("click", ()=>{
    filtro.estado = chip.dataset.filter;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-selected", c === chip));
    filtrar();
  });
});

let espera;
$("#busca").addEventListener("input", e=>{
  clearTimeout(espera);
  filtro.busca = e.target.value;
  espera = setTimeout(filtrar, 120);
});
$("#geracao").addEventListener("change", e=>{ filtro.geracao = e.target.value; filtrar(); });
$("#tipo").addEventListener("change",    e=>{ filtro.tipo    = e.target.value; filtrar(); });

/* ============================================================
   SORTEIO — scanner de Pokédex
   ------------------------------------------------------------
   Sorteia só entre os que faltam, sem repetir enquanto houver
   Pokémon inédito. O vencedor é decidido antes da animação:
   a desaceleração é encenação, não o sorteio em si.
   ============================================================ */

/* ------------------------------------------------------------
   LOJAS — para adicionar outra, basta copiar uma linha.
   {nome} é trocado pelo nome do Pokémon já codificado.
   ------------------------------------------------------------ */
const LOJAS = [
  { nome:"Liga Pokémon", url:"https://www.ligapokemon.com.br/?view=cards/search&card={nome}" }
];

/* as lojas indexam pelo nome em inglês simples: tira acento e símbolo */
const nomeParaBusca = nome => nome
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")   // Flabébé → Flabebe
  .replace(/[♀♂]/g, "")                                // Nidoran ♀ → Nidoran
  .replace(/[.:']/g, "")                               // Mr. Mime → Mr Mime
  .trim();

let sorteios = [];          // [[id, "2026-08-11"], ...] mais recente primeiro
let rodando  = false;

const dorme   = ms => new Promise(r => setTimeout(r, ms));
const aoAcaso = lista => lista[Math.floor(Math.random() * lista.length)];

/* espera as imagens entrarem no cache para a animação não engasgar */
const prepararImagens = urls => Promise.race([
  Promise.all(urls.map(u => new Promise(ok=>{
    const img = new Image();
    img.onload = img.onerror = ok;
    img.src = u;
  }))),
  dorme(2500)
]);

function candidatos(){
  const faltam = POKEMON.filter(p => !tenho.has(p[0]));
  if (!faltam.length) return { lista:[], reiniciar:false };

  const jaSairam = new Set(sorteios.map(s => s[0]));
  const ineditos = faltam.filter(p => !jaSairam.has(p[0]));

  return ineditos.length
    ? { lista:ineditos, reiniciar:false }
    : { lista:faltam,   reiniciar:true  };   // todos já saíram: recomeça
}

function mostrarNoPalco([id, nome, tipos], final){
  const palco = $("#palco");
  const url = SPRITE(id);
  $("#s-silh").style.setProperty("--sprite", `url('${url}')`);
  $("#s-foto").src = url;
  $("#s-num").textContent  = pad(id);
  $("#s-nome").textContent = nome;

  if (final){
    palco.style.setProperty("--c", CORES[tipos[0]]);
    palco.classList.add("acerto");
    $("#s-tags").innerHTML = tipos.map(t =>
      `<i class="tag" style="--t:${CORES[t]}">${t}</i>`).join("");

    const busca = encodeURIComponent(nomeParaBusca(nome));
    $("#lojas").innerHTML = LOJAS.map(l =>
      `<a href="${l.url.replace("{nome}", busca)}" target="_blank" rel="noopener noreferrer">Procurar na ${l.nome}</a>`
    ).join("");
  }
}

function pintarHistorico(){
  const h = $("#hist");
  if (!sorteios.length){ h.innerHTML = ""; return; }

  h.innerHTML = sorteios.slice(0,8).map(([id, data])=>{
    const p = POKEMON.find(x => x[0] === id);
    const dia = data.slice(8,10) + "/" + data.slice(5,7);
    return `<div>${pad(id)} <b>${p ? p[1] : ""}</b><span>${dia}</span></div>`;
  }).join("");
}

async function sortear(){
  if (rodando) return;
  rodando = true;

  const palco = $("#palco");
  $("#modal").hidden  = false;
  $("#acoes").hidden  = true;
  palco.classList.remove("acerto");
  $("#s-tags").innerHTML  = "";
  $("#lojas").innerHTML   = "";
  $("#s-num").textContent = "#????";
  $("#s-nome").textContent = "Sorteando…";

  const { lista, reiniciar } = candidatos();

  if (!lista.length){
    $("#s-nome").textContent = "Coleção completa";
    $("#s-num").textContent  = "";
    $("#s-silh").style.removeProperty("--sprite");
    $("#s-foto").removeAttribute("src");
    rodando = false;
    return;
  }

  if (reiniciar){
    sorteios = [];
    aviso("Todos os que faltam já saíram uma vez. A lista recomeçou.");
  }

  const vencedor = aoAcaso(lista);
  const teatro   = Array.from({length:11}, () => aoAcaso(lista));

  await prepararImagens([vencedor, ...teatro].map(p => SPRITE(p[0])));

  /* o scanner: rápido no começo, freando até parar */
  let intervalo = 50;
  const sequencia = [...teatro, vencedor];

  for (let i = 0; i < sequencia.length; i++){
    mostrarNoPalco(sequencia[i], i === sequencia.length - 1);
    await dorme(intervalo);
    intervalo *= 1.25;
  }

  sorteios.unshift([vencedor[0], new Date().toISOString().slice(0,10)]);
  sorteios = sorteios.slice(0, 60);
  try{ await Salvo.gravar(Salvo.SORTEIOS, JSON.stringify(sorteios)); }catch(e){}

  pintarHistorico();
  $("#acoes").hidden = false;
  $("#marcar").dataset.id = vencedor[0];
  rodando = false;
}

function fecharModal(){ if (!rodando) $("#modal").hidden = true; }

$("#sortear").addEventListener("click", sortear);
$("#denovo").addEventListener("click", sortear);
$("#fechar").addEventListener("click", fecharModal);
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") fecharModal(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  fecharModal();
  abrirMenu(false);
});

$("#marcar").addEventListener("click", e=>{
  const id = +e.target.dataset.id;
  tenho.add(id);
  Salvo.colecao(tenho);

  const card = grid.querySelector(`.card[data-id="${id}"]`);
  if (card){
    card.classList.add("own");
    card.setAttribute("aria-pressed","true");
  }
  contar();
  if (filtro.estado !== "all") filtrar();

  $("#modal").hidden = true;
  aviso("Marcado como seu.");
});

/* ---------- MENU DE PERFIL ---------- */

function abrirMenu(abrir){
  $("#menu").hidden = !abrir;
  $("#avatar").setAttribute("aria-expanded", abrir);
}

$("#avatar").addEventListener("click", e=>{
  e.stopPropagation();
  abrirMenu($("#menu").hidden);
});
document.addEventListener("click", e=>{
  if (!$("#menu").hidden && !e.target.closest(".perfil")) abrirMenu(false);
});

/* ---------- MODO DA ARTE: foto real ou cor do tipo ---------- */

const MODO_KEY = "pokedex.modo.v1";

function aplicarModo(modo){
  document.body.classList.toggle("modo-foto", modo === "foto");
  document.body.classList.toggle("modo-cor",  modo !== "foto");
  $("#modo").textContent = modo === "foto" ? "Modo: foto" : "Modo: cor do tipo";
}

$("#modo").addEventListener("click", async ()=>{
  const novo = document.body.classList.contains("modo-foto") ? "cor" : "foto";
  aplicarModo(novo);
  abrirMenu(false);
  try{ await Salvo.gravar(MODO_KEY, novo); }catch(e){}
});

/* ---------- BACKUP ---------- */

$("#exportar").addEventListener("click", ()=>{
  const backup = { app:"pokedex-do-j", versao:2, exportadoEm:new Date().toISOString(),
                   total:tenho.size, tenho:[...tenho].sort((a,b)=>a-b), sorteios };
  const url = URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = `pokedex-do-j-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  aviso(`Backup exportado com ${tenho.size} Pokémon.`);
});

$("#importar").addEventListener("click", ()=> $("#arquivo").click());

$("#arquivo").addEventListener("change", async e=>{
  const f = e.target.files[0];
  if (!f) return;
  try{
    const d = JSON.parse(await f.text());
    const lista = Array.isArray(d) ? d : d.tenho;
    if (!Array.isArray(lista)) throw new Error();
    const ids = lista.map(Number).filter(n => Number.isInteger(n) && n > 0);

    if (!confirm(`O backup tem ${ids.length} Pokémon e vai substituir sua coleção atual de ${tenho.size}. Continuar?`)) return;

    tenho = new Set(ids);
    Salvo.colecao(tenho);

    if (Array.isArray(d.sorteios)){
      sorteios = d.sorteios;
      try{ await Salvo.gravar(Salvo.SORTEIOS, JSON.stringify(sorteios)); }catch(e){}
      pintarHistorico();
    }

    grid.querySelectorAll(".card").forEach(c=>{
      const possuo = tenho.has(+c.dataset.id);
      c.classList.toggle("own", possuo);
      c.setAttribute("aria-pressed", possuo);
    });
    contar(); filtrar();
    aviso(`Coleção restaurada: ${ids.length} Pokémon.`);
  }catch(err){
    aviso("Arquivo inválido. Use um JSON exportado por aqui.");
  }finally{ e.target.value = ""; }
});

/* ============================================================
   INÍCIO
   ============================================================ */

(async function iniciar(){
  try{
    /* 0. modo da arte escolhido da última vez */
    aplicarModo(await Salvo.ler(MODO_KEY) || "foto");

    /* 1. dados: usa a cópia local; só busca na internet na primeira vez */
    const cache = await Salvo.ler(Salvo.DADOS);
    POKEMON = cache ? JSON.parse(cache) : await baixarDados();

    /* 2. preenche o filtro de tipos */
    const tipos = [...new Set(POKEMON.flatMap(p => p[2]))].sort();
    $("#tipo").insertAdjacentHTML("beforeend",
      tipos.map(t => `<option value="${t}">${t[0].toUpperCase()+t.slice(1)}</option>`).join(""));

    /* 3. coleção e histórico de sorteios salvos */
    const salva = await Salvo.ler(Salvo.COLECAO);
    tenho = new Set(salva ? JSON.parse(salva) : []);

    const hist = await Salvo.ler(Salvo.SORTEIOS);
    sorteios = hist ? JSON.parse(hist) : [];
    pintarHistorico();

    montar();
    contar();
    grid.querySelectorAll(".card").forEach(c=>{
      if (tenho.has(+c.dataset.id)){
        c.classList.add("own");
        c.setAttribute("aria-pressed","true");
      }
    });
    status(true);

  }catch(err){
    $("#tela").innerHTML =
      `<b>Não consegui buscar os Pokémon</b>` +
      `A PokéAPI não respondeu. Verifique sua conexão e tente de novo.` +
      `<div><button onclick="location.reload()">Tentar de novo</button></div>`;
    status(false);
  }
})();
</script>
